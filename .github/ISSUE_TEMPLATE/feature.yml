name: Feature Request
description: Propose a new feature or functionality for Craft BD
title: "[FEATURE] "
labels:
  - "type: feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are we trying to solve?
      placeholder: Describe the real user or business problem.
    validations:
      required: true

  - type: dropdown
    id: user
    attributes:
      label: Primary User
      description: Who mainly needs this feature?
      options:
        - Customer
        - Artisan
        - Administrator
        - Development Team
        - Other
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: What should the system do?
      placeholder: The system shall...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define the conditions required for this feature to be considered complete.
      placeholder: |
        - [ ] Condition 1
        - [ ] Condition 2
        - [ ] Condition 3
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Mention any feature, requirement, or technical dependency.
      placeholder: None, or list related dependencies.

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Add any useful context, screenshots, links, or references.
